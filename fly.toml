# The dev API's Fly app (docs/plans/api-b0-deploy.md, section 2; TECH-DESIGN sections 1, 7 and 9; ADR-003,
# ADR-017, ADR-023). One image, two process groups: the API, which Fly's proxy serves on
# api-dev.tadayo.app, and the worker, which has no service, so the proxy never starts or stops it
# (`ops` worker-scale does). One Machine of each: `dev` has no spare, and the deploys pass --ha=false.
#
# What is set here is public: the Supabase project's URL and publishable key are in the iOS app's Dev
# build too (T53). The photo user's name, TADAYO_PHOTO_USER, is the image's own, set beside the user it makes in the
# Dockerfile, so a configuration that leaves [env] out still names it (the audit's A6). The secrets, the database's connection string and Supabase's service key, are Fly's
# own, set by the founder, and never in this file (T56). tools/ops/src/deploy-files.test.ts reads this
# file against the Dockerfile and the rest of the repository.
#
# A section that binds to a group has `processes`. Left out, `flyctl` refuses a `[[services]]` while
# `[processes]` is defined, gives `[[restart]]`, `[checks]` and the like to the default group only (`app`,
# else the first name in sorted order, here `api`), and lets `[[vm]]` cover every group, as the one at
# the end does.

app = "tadayo-api-dev"
primary_region = "iad"

# A stop is SIGTERM, which both entries handle: the API finishes the requests it has and the worker
# exits; the time is for a request still in flight.
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

# Migrations run before the deploy, from the runner, so there is no release command: a failed
# migration stops the deploy before a Machine changes.
[deploy]
  strategy = "rolling"

[env]
  TADAYO_ENVIRONMENT = "dev"
  SUPABASE_URL = "https://rhsycmycocbzakrydahi.supabase.co"
  SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5kJcQ8JCyWiHHMGjucf00w_8ehpABvL"
  LOG_LEVEL = "info"

# Each command starts as root and drops at once with `setpriv` (the Dockerfile's header; ADR-038). The API becomes
# `node` for good: real, effective and saved ids, no capability, no way to gain one. The worker becomes `node` in
# effect only, its real user root, so its /proc files are root's, and it keeps setuid, setgid and kill, which it uses
# only for an instant at a time to start each photo's process as TADAYO_PHOTO_USER and end it; its inheritable set is
# emptied too, as what it keeps is its bounding set and that set together. Its `setpriv` sets no user or group id:
# on Fly's kernel an exec under no new privileges puts an effective id that differs from the real one back to the
# real one, root's (PR #132's start on `dev`), so Node starts as root and the worker's first module takes `node`'s
# effective group and user (services/worker/src/turn.ts). Before it drops, the worker's `prlimit`
# lets no process of it or of a photo's process dump core (each holds a photo, or the worker's keys: a limit of 1 byte
# stops a dump to a file and one to a program alike, where 0 stops only the first), lets none make a POSIX message
# queue (one could outlast the sweep where /dev/mqueue isn't mounted), and lets the photo's user have 256 processes at
# most (the worker's real user, root, is exempt). Node's inspector is off in both (`--disable-sigusr1`): SIGUSR1 would
# open it, with no password, to anyone on the Machine (PR #118's review).
[processes]
  api = "setpriv --reuid=node --regid=node --init-groups --inh-caps=-all --bounding-set=-all --no-new-privs -- node --disable-sigusr1 services/api/src/main.ts"
  worker = "prlimit --core=1 --msgqueue=0 --nproc=256 -- setpriv --groups=node --inh-caps=-all --bounding-set=-all,+setuid,+setgid,+kill --no-new-privs -- node --disable-sigusr1 services/worker/src/main.ts"

# The API's service. It listens only after the database and the clock are ready, so an open port is a
# started API. The check is on the port and not on a route: a route to ask would be one outside the
# contract, which the privacy matrix would have to cover (T58).
[[services]]
  processes = ["api"]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "off"

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "3s"

# A group is restarted only when it failed: a clean exit, which is what a stop is, leaves it stopped, so
# the worker stays down across deploys until `ops` worker-scale starts it.
[[restart]]
  policy = "on-failure"
  processes = ["api", "worker"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
