# The TypeScript workspace (docs/TECH-DESIGN.md section 3). The Swift packages sit beside it.
packages:
  - apps/web
  - packages/domain
  - packages/contracts
  - services/api
  - services/worker
  - tests
  - tools/ops
# Dependencies' build scripts that never run (pnpm 12 refuses to install while one is unruled).
# Only denials belong here: approving a build script is a CI-configuration PR (T58).
allowBuilds:
  # Prism's install analytics (docs/LIMITATIONS.md).
  "@scarf/scarf": false
