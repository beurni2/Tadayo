  /v1/occurrences/{occurrence_id}/drops:
    post:
      operationId: createDrop
      summary: Add a drop to a day
      description: "Commit ready media, the caption and the immutable audience in one transaction (spec 32; T3, T8, T17, T19). Only this response means Added (T20). A missed cutoff answers OCCURRENCE_CLOSED with the same person's next day to confirm, and nothing is moved (T4). A reservation that has lapsed counts as none: a free slot is taken if there is one, or QUOTA_FULL (T18)."
      parameters:
        - name: occurrence_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDropRequest"
      responses:
        "201":
          description: Add a drop to a day
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DropReceipt"
              examples:
                added:
                  summary: Added for Debby's Friday 13 November (F02-added)
                  value:
                    drop_id: drp_ben_13
