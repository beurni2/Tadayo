    delete:
      operationId: revokeInvitation
      summary: Revoke a link
      description: The link stops working; the candidate keeps their place, and the proposer can make a new link (Link revoked, G01-invite-people-revoked). Repeating the revoke returns the same answer. NOT_ALLOWED once the candidate has accepted with it, in this revision or an earlier one, since accepting isn't undone by revoking a link (handoff 4). Anyone but the candidate's proposer gets NOT_FOUND, whatever the link's state (T14, handoff 1).
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: Revoke a link
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedInvitation"
              examples:
                revoked:
                  summary: The link no longer works
                  value:
                    invitation_id: inv_kt_leila
                    state: revoked
        "400":
          description: INVALID_REQUEST
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_REQUEST:
                  summary: The request doesn't match the contract. `field` names the first bad field, never its value.
                  value:
                    code: INVALID_REQUEST
        "401":
          description: UNAUTHENTICATED
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  summary: "No valid session: sign in again."
                  value:
                    code: UNAUTHENTICATED
        "403":
          description: PROFILE_INCOMPLETE, NOT_ALLOWED
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                PROFILE_INCOMPLETE:
                  summary: "The account hasn't confirmed it's 18 or older (FQ13) or has no name yet: finish `PATCH /v1/me` first. Until then it can only finish setup or leave (FQ69)."
                  value:
                    code: PROFILE_INCOMPLETE
                NOT_ALLOWED:
                  summary: "Something the caller can see but can't do now: reacting to their own drop (spec 16), confirming a day that clashes with another member's choice (FQ55), or, for the candidate's proposer alone, revoking or replacing a link the candidate has accepted with (handoff 4)."
