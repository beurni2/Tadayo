      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: Home for a club
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Home"
              examples:
                open:
                  summary: "Friday 6 November, 9:41 AM: Home is Debby's Friday (H01-open)"
                  value:
                    mode: day
                    server_now: 2026-11-06T14:41:00Z
                    club:
