# Generated from packages/contracts/src by `pnpm --filter @tadayo/contracts openapi:write`.
# Never edit it by hand: `openapi:check` (the ci step `openapi`) fails when it and the zod schemas differ.
openapi: 3.1.0
info:
  title: Tadayo API
  version: 1.0.0
  description: |-
    Tadayo's v1 API: the seam between the TypeScript API and the iPhone app (docs/MILESTONES.md, "Lanes").

    Generated from the zod schemas in packages/contracts/src by `pnpm --filter @tadayo/contracts openapi:write`; never edit it by hand.

    Rules every endpoint keeps:
    - Authentication: a Supabase session's access token as a bearer token (T53), except where an operation says it's public.
    - Unauthorized looks like missing: anything the caller may not see is the neutral NOT_FOUND (T14).
    - Before the reveal, others get a drop's caption and nothing else (T10); media streams only through this API and no storage URL for reading ever reaches the app (T12).
    - Every mutation a retry could duplicate takes an Idempotency-Key, created when the action starts and reused on every retry. A key is the caller's own, for one operation, and each action has its own: the same path, query and body return the original response; a different path, query or body is IDEMPOTENCY_CONFLICT (T19). Edits carry the version they read.
    - Times are UTC instants; the server's clock decides (T1). Ids are opaque and random.
    - Errors carry a code and facts, never copy: the app owns its words (T41 to T43).
    - Lists are cursor-paged and filtered for the caller (T14). A cursor is opaque and carries no time.
    - Every answer with a body says Cache-Control: private, no-store, and every image its ETag; a link's JSON has none.
    - Requests refuse unknown fields; answers may gain fields, so an app ignores the ones it doesn't know.
servers:
  - url: https://api-dev.tadayo.app
    description: dev
  - url: http://127.0.0.1:4010
    description: The Prism mock (pnpm --filter @tadayo/contracts mock). Its images are placeholders, not JPEG bytes, and it checks a request's shape but not the rules only the API can (grapheme counts, only true).
security:
  - bearer: []
paths:
  /v1/account/delete:
    post:
      operationId: deleteAccount
      summary: Delete the account
      description: Revoke access, then remove authored content everywhere through durable jobs (spec 23, T27).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "202":
          description: Delete the account
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletion"
              examples:
                deleting:
                  summary: Deletion started
                  value:
                    state: deleting
                    requested_at: 2026-11-09T14:41:00Z
        "400":
          description: INVALID_REQUEST
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_REQUEST:
                  summary: The request doesn't match the contract. `field` names the first bad field, never its value.
                  value:
                    code: INVALID_REQUEST
        "401":
          description: UNAUTHENTICATED
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  summary: "No valid session: sign in again."
                  value:
                    code: UNAUTHENTICATED
        "409":
          description: IDEMPOTENCY_CONFLICT
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                IDEMPOTENCY_CONFLICT:
                  summary: The same Idempotency-Key came again for the same operation with a different path, query or body (T19). A key is the caller's own, for one operation.
                  value:
                    code: IDEMPOTENCY_CONFLICT
        "429":
          description: RATE_LIMITED
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                RATE_LIMITED:
                  summary: "Too many requests: try again after `retry_after_seconds`."
                  value:
                    code: RATE_LIMITED
                    retry_after_seconds: 30
  /v1/blocks:
    post:
      operationId: blockMember
      summary: Block someone and leave the clubs shared with them
      description: Spec 22, D11, T26. The blocked person is never told (spec 21).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockRequest"
      responses:
        "201":
          description: Block someone and leave the clubs shared with them
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResult"
              examples:
                blocked:
                  summary: Blocked, and left both clubs
                  value:
                    block_id: blk_ben_1
                    left_club_ids:
                      - club_sunday_people
                      - club_kitchen_table
                    past_contributions: keep
        "400":
          description: INVALID_REQUEST
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_REQUEST:
                  summary: The request doesn't match the contract. `field` names the first bad field, never its value.
                  value:
                    code: INVALID_REQUEST
        "401":
          description: UNAUTHENTICATED
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  summary: "No valid session: sign in again."
                  value:
                    code: UNAUTHENTICATED
        "403":
          description: PROFILE_INCOMPLETE
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                PROFILE_INCOMPLETE:
                  summary: "The account hasn't confirmed it's 18 or older (FQ13) or has no name yet: finish `PATCH /v1/me` first. Until then it can only finish setup or leave (FQ69)."
                  value:
                    code: PROFILE_INCOMPLETE
        "404":
          description: NOT_FOUND
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                NOT_FOUND:
                  summary: "Missing, or not the caller's to see: the two are the same answer, and say nothing about hidden content (T14)."
                  value:
                    code: NOT_FOUND
        "409":
          description: IDEMPOTENCY_CONFLICT, MEMBERSHIP_CHANGED
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                IDEMPOTENCY_CONFLICT:
                  summary: The same Idempotency-Key came again for the same operation with a different path, query or body (T19). A key is the caller's own, for one operation.
                  value:
                    code: IDEMPOTENCY_CONFLICT
                MEMBERSHIP_CHANGED:
                  summary: "A membership changed since the action started: the person's, so `target`, the day asked for, must be chosen again (T4, spec 32); the club's, so a newer schedule proposal (`current_id`) replaced this one; or the clubs a block would leave."
                  value:
                    code: MEMBERSHIP_CHANGED
                    target:
                      id: occ_sp_debby_2026_11_13
                      club_id: club_sunday_people
                      star:
                        membership_id: mem_sp_debby
                        display_name: Debby
                        avatar_version: av_debby_1
                      local_date: 2026-11-13
                      reveal_at: 2026-11-13T12:00:00Z
                      close_at: 2026-11-14T06:00:00Z
                      phase: collecting
        "429":
          description: RATE_LIMITED
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                RATE_LIMITED:
                  summary: "Too many requests: try again after `retry_after_seconds`."
                  value:
                    code: RATE_LIMITED
                    retry_after_seconds: 30
