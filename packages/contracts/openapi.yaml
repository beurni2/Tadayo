  /v1/clubs/{club_id}/invitations:
    post:
      operationId: createInvitation
      summary: A share link for one candidate
      description: "Only the member who proposed the candidate can make or revoke its link (T7 makes the link single-use): during setup from the invitation list (G01-invite-people), which FQ51's default reaches only then; for a later addition, such as Leila in Kitchen table (book p30), where the link is shared and managed has no render yet. A new link replaces the candidate's earlier one, after a revoke or an expiry (Create new link) or when the app no longer holds it (FQ77), and NOT_ALLOWED once the candidate has accepted with it (handoff 4). Anyone but the candidate's proposer gets NOT_FOUND, whatever the link's state, so the answer never tells another member that the candidate accepted (T14, handoff 1). A retry with the same key returns the first answer without its `url`, and makes nothing new (InvitationLink, T19, FQ77)."
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: A share link for one candidate
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationLink"
              examples:
                link:
                  summary: Leila's share link, for Ben to send (book p30)
                  value:
                    invitation_id: inv_kt_leila
                    candidate_id: cnd_kt_leila
                    url: https://tadayo.app/i#q7Vb2xKp9LmN4wRt6YsA1cDe8FgH3jZu5oIi0nQvXkM
                    expires_at: 2026-11-13T14:41:00Z
                replayed:
                  summary: "A retry with the same key: the first answer without its link, which the app offers to remake (FQ77)"
                  value:
                    invitation_id: inv_kt_leila
                    candidate_id: cnd_kt_leila
                    expires_at: 2026-11-13T14:41:00Z
        "400":
          description: INVALID_REQUEST
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_REQUEST:
                  summary: The request doesn't match the contract. `field` names the first bad field, never its value.
                  value:
                    code: INVALID_REQUEST
        "401":
          description: UNAUTHENTICATED
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  summary: "No valid session: sign in again."
                  value:
                    code: UNAUTHENTICATED
        "403":
          description: PROFILE_INCOMPLETE, NOT_ALLOWED
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                PROFILE_INCOMPLETE:
                  summary: "The account hasn't confirmed it's 18 or older (FQ13) or has no name yet: finish `PATCH /v1/me` first. Until then it can only finish setup or leave (FQ69)."
                  value:
                    code: PROFILE_INCOMPLETE
                NOT_ALLOWED:
                  summary: "Something the caller can see but can't do now: reacting to their own drop (spec 16), confirming a day that clashes with another member's choice (FQ55), or, for the candidate's proposer alone, revoking or replacing a link the candidate has accepted with (handoff 4)."
                  value:
                    code: NOT_ALLOWED
        "404":
          description: NOT_FOUND
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                NOT_FOUND:
                  summary: "Missing, or not the caller's to see: the two are the same answer, and say nothing about hidden content (T14)."
                  value:
                    code: NOT_FOUND
        "409":
          description: IDEMPOTENCY_CONFLICT
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
