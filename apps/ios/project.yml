# The iPhone app, generated by XcodeGen (docs/TECH-DESIGN.md section 1): the app, its share
# extension and the snapshot tests. The .xcodeproj is never committed.
#
# Three configurations (TECH-DESIGN section 4, "The Lab"):
#   Debug    the simulator and the `ios` workflow; points at dev; LAB and TRIAL_OVERLAY on.
#   Dev      a release build that points at dev, for TestFlight until Gate D; LAB and
#            TRIAL_OVERLAY on.
#   Release  a release build that points at prod; no LAB, no TRIAL_OVERLAY, and no fixture
#            photographs (EXCLUDED_SOURCE_FILE_NAMES), which slice 12's ios-release checks.
#
# Supabase's project URL and publishable key are public by design (T53; docs/plans/B0.md 1.2):
# never a secret (T56). Dev carries tadayo-dev's. Debug builds run only in the simulator and on
# CI, which never send a sign-in code, so Debug's URL is under .invalid (RFC 6761), which never
# resolves. Release has none yet and fails closed: the app builds no network at all.
name: Tadayo
options:
  bundleIdPrefix: app.tadayo
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Dev: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: true
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG LAB TRIAL_OVERLAY
      TADAYO_ENVIRONMENT: dev
      TADAYO_API_BASE_URL: https://api-dev.tadayo.app
      TADAYO_SUPABASE_URL: https://supabase.invalid
      TADAYO_SUPABASE_PUBLISHABLE_KEY: sb_publishable_none
    Dev:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: LAB TRIAL_OVERLAY
      TADAYO_ENVIRONMENT: dev
      TADAYO_API_BASE_URL: https://api-dev.tadayo.app
      TADAYO_SUPABASE_URL: https://rhsycmycocbzakrydahi.supabase.co
      TADAYO_SUPABASE_PUBLISHABLE_KEY: sb_publishable_5kJcQ8JCyWiHHMGjucf00w_8ehpABvL
    Release:
      TADAYO_ENVIRONMENT: prod
      TADAYO_API_BASE_URL: https://api.tadayo.app
      EXCLUDED_SOURCE_FILE_NAMES: Fixtures.xcassets
packages:
  TadayoCore:
    path: ../../packages/swift/TadayoCore
  TadayoDesign:
    path: ../../packages/swift/TadayoDesign
  TadayoAPI:
    path: ../../packages/swift/TadayoAPI
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.7
targets:
  Tadayo:
    type: application
    platform: iOS
    sources:
      - path: Tadayo
      - path: Shared
      - path: Fixtures/Fixtures.xcassets
        buildPhase: resources
    dependencies:
      - target: TadayoShare
      - package: TadayoCore
      - package: TadayoDesign
      - package: TadayoAPI
    # The app group the app and the share extension share, which is also their keychain access
    # group (ADR-019; TECH-DESIGN section 4). And the app's one associated domain, so an
    # invitation link, https://tadayo.app/i#<token>, opens the app (spike S6; B1's invitations):
    # tadayo.app's apple-app-site-association names this app for /i (apps/web), and the release
    # check lets the app alone hold exactly this value (tools/ci/ios_release_steps.py). The share
    # extension opens no links. XcodeGen writes the file.
    entitlements:
      path: Tadayo/Tadayo.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.tadayo
        com.apple.developer.associated-domains:
          - applinks:tadayo.app
    info:
      path: Tadayo/Info.plist
      properties:
        CFBundleDisplayName: Tadayo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        # Tadayo's launch screen is the canvas alone, light and dark, with no logo, wordmark,
        # spinner or text (handoff 7's launch.iOSLaunchScreen): the colour set LaunchBackground
        # in Tadayo/Assets.xcassets holds canvas's two values (Palette.canvas), the canvas the
        # root's waits (global-launch, global-leaving) are drawn on.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        TadayoEnvironment: $(TADAYO_ENVIRONMENT)
        TadayoAPIBaseURL: $(TADAYO_API_BASE_URL)
        TadayoSupabaseURL: $(TADAYO_SUPABASE_URL)
        TadayoSupabasePublishableKey: $(TADAYO_SUPABASE_PUBLISHABLE_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tadayo
        # iPhone only (ADR-001). Each target sets it: XcodeGen's iOS preset sets "1,2" at target
        # level, which a project-level setting can't override.
        TARGETED_DEVICE_FAMILY: "1"
        # The app icon is the brand's three masters (design/reference/brand/) as one universal
        # 1024-point icon with a dark and a tinted appearance: Tadayo/Assets.xcassets/
        # AppIcon.appiconset (slice 11b). XcodeGen's default names it AppIcon too; saying it here
        # keeps the name beside the catalog that holds it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TadayoShare:
    type: app-extension
    platform: iOS
    sources:
      - path: TadayoShare
      - path: Shared
    dependencies:
      - package: TadayoCore
    entitlements:
      path: TadayoShare/TadayoShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.tadayo
    info:
      path: TadayoShare/Info.plist
      properties:
        CFBundleDisplayName: Tadayo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Photos and one link (spec 10, screen C04): at most six photos, the most one day's
            # allowance takes (D05), and one web link or shared text holding one. Never
            # TRUEPREDICATE, which App Store review rejects.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 6
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tadayo.share
        TARGETED_DEVICE_FAMILY: "1"
  TadayoSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TadayoSnapshotTests
        excludes:
          - "**/__Snapshots__"
    dependencies:
      - target: Tadayo
      - package: TadayoCore
      - package: TadayoDesign
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: app.tadayo.snapshot-tests
        TARGETED_DEVICE_FAMILY: "1"
  # Hosted unit tests (the keychain store, the launch and its screen's colour, the connections,
  # what the tabs announce, the root's waits and where its failure sits, the drop card's spoken
  # labels, the busy button's size and place and what VoiceOver finds on the sign-in screens, and
  # TadayoDesign's string catalog), which run on both iOS versions each `ios` run tests, 27.2 and
  # 26.5; the targets ending in SnapshotTests run on iOS 27.2 alone (ADR-033;
  # TadayoSnapshotTests/__Snapshots__/ios-version). The in-process accessibility reader and
  # the scripted services that put a screen mid-request are the snapshot tests' own files,
  # compiled here too.
  TadayoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TadayoTests
      - path: TadayoSnapshotTests/AccessibilityElements.swift
      - path: TadayoSnapshotTests/ScriptedServices.swift
    dependencies:
      - target: Tadayo
      - package: TadayoCore
      - package: TadayoDesign
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: app.tadayo.tests
        TARGETED_DEVICE_FAMILY: "1"
  # The app launched as a person would, with no session and no network.
  TadayoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TadayoUITests
    dependencies:
      - target: Tadayo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: app.tadayo.ui-tests
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Tadayo:
    build:
      targets:
        Tadayo: all
        TadayoShare: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TadayoSnapshotTests
        - TadayoTests
        - TadayoUITests
    archive:
      config: Dev
