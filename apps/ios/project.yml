# The minimal app for the `ios` workflow's first run (docs/plans/B0.md, slice 9): the app and its
# share extension, each with only an entry point. Only on `ios/b0-ios-check`, which is never
# opened as a PR; the ios lane's first slice brings the real project.
name: Tadayo
options:
  bundleIdPrefix: app.tadayo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tadayo:
    type: application
    platform: iOS
    sources:
      - path: Tadayo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tadayo
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    dependencies:
      - target: TadayoShare
  TadayoShare:
    type: app-extension
    platform: iOS
    sources:
      - path: TadayoShare
    info:
      path: TadayoShare/Info.plist
      properties:
        CFBundleDisplayName: Tadayo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: TRUEPREDICATE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tadayo.share
schemes:
  Tadayo:
    build:
      targets:
        Tadayo: all
        TadayoShare: all
