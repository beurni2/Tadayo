# The iPhone app, generated by XcodeGen (docs/TECH-DESIGN.md section 1): the app, its share
# extension and the snapshot tests. The .xcodeproj is never committed.
#
# Three configurations (TECH-DESIGN section 4, "The Lab"):
#   Debug    the simulator and the `ios` workflow; points at dev; LAB and TRIAL_OVERLAY on.
#   Dev      a release build that points at dev, for TestFlight until Gate D; LAB and
#            TRIAL_OVERLAY on.
#   Release  a release build that points at prod; no LAB, no TRIAL_OVERLAY, and no fixture
#            photographs (EXCLUDED_SOURCE_FILE_NAMES), which slice 12's ios-release checks.
name: Tadayo
options:
  bundleIdPrefix: app.tadayo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Dev: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: true
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG LAB TRIAL_OVERLAY
      TADAYO_ENVIRONMENT: dev
      TADAYO_API_BASE_URL: https://api-dev.tadayo.app
    Dev:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: LAB TRIAL_OVERLAY
      TADAYO_ENVIRONMENT: dev
      TADAYO_API_BASE_URL: https://api-dev.tadayo.app
    Release:
      TADAYO_ENVIRONMENT: prod
      TADAYO_API_BASE_URL: https://api.tadayo.app
      EXCLUDED_SOURCE_FILE_NAMES: Fixtures.xcassets
packages:
  TadayoCore:
    path: ../../packages/swift/TadayoCore
  TadayoAPI:
    path: ../../packages/swift/TadayoAPI
  TadayoDesign:
    path: ../../packages/swift/TadayoDesign
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.7
targets:
  Tadayo:
    type: application
    platform: iOS
    sources:
      - path: Tadayo
      - path: Fixtures/Fixtures.xcassets
        buildPhase: resources
    dependencies:
      - target: TadayoShare
      - package: TadayoCore
      - package: TadayoAPI
      - package: TadayoDesign
    info:
      path: Tadayo/Info.plist
      properties:
        CFBundleDisplayName: Tadayo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        TadayoEnvironment: $(TADAYO_ENVIRONMENT)
        TadayoAPIBaseURL: $(TADAYO_API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tadayo
        # iPhone only (ADR-001). Each target sets it: XcodeGen's iOS preset sets "1,2" at target
        # level, which a project-level setting can't override.
        TARGETED_DEVICE_FAMILY: "1"
        # No app icon until slice 11b brings it from design/reference/brand/ (XcodeGen's default
        # names AppIcon, which no catalog holds yet).
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  TadayoShare:
    type: app-extension
    platform: iOS
    sources:
      - path: TadayoShare
    dependencies:
      - package: TadayoCore
    info:
      path: TadayoShare/Info.plist
      properties:
        CFBundleDisplayName: Tadayo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Photos and one link (spec 10, screen C04): at most six photos, the most one day's
            # allowance takes (D05), and one web link or shared text holding one. Never
            # TRUEPREDICATE, which App Store review rejects.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 6
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tadayo.share
        TARGETED_DEVICE_FAMILY: "1"
  TadayoSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TadayoSnapshotTests
        excludes:
          - "**/__Snapshots__"
    dependencies:
      - target: Tadayo
      - package: TadayoCore
      - package: TadayoDesign
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: app.tadayo.snapshot-tests
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Tadayo:
    build:
      targets:
        Tadayo: all
        TadayoShare: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TadayoSnapshotTests
    archive:
      config: Dev
