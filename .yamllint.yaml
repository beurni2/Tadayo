# yamllint settings for this repository, used by local runs (docs/GITHUB.md, "Workflow files").
# CI configuration: change it only in its own PR (docs/INVARIANTS.md T58).
extends: default
rules:
  line-length:
    max: 200
    level: warning
  document-start: disable
  truthy:
    check-keys: false  # GitHub Actions uses `on:` as a key
  # When GitHub refuses the session's push of a workflow file, the founder adds it through
  # GitHub's web editor, and a file added that way usually loses its final line break
  # (docs/GITHUB.md, "If GitHub refuses a workflow push"). Off while that fallback stands.
  new-line-at-end-of-file: disable
