# ios-release: archives the iPhone app, checks what the archive holds, and uploads it to
# TestFlight (docs/TECH-DESIGN.md sections 2 and 9; the B0 plan's slice 12). Run by hand only, on
# a chosen branch.
# Thin on purpose: every step calls tools/ci/ios_release_steps.py, where the logic and its tests
# live (ios_release_steps_test.py reads this file).
# Two jobs on two runners, so the App Store Connect API key never shares a machine with the build:
# `build` archives and checks with no secret at all, and runs the packages' build plugins; `sign`
# runs only on a dev upload, on a fresh runner with a fresh checkout, takes the archive as one tar
# file it checks member by member, and gives the key to its export and upload steps alone.
# CI configuration: change this file only in its own PR (docs/INVARIANTS.md T58).
name: ios-release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: >-
          dev: a release build that points at dev, with the Lab. prod: built and checked, never
          uploaded by this workflow
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod
      upload:
        description: >-
          Sign for App Store Connect and upload to TestFlight. Off: a dry run, which archives and
          checks and touches nothing at Apple
        type: boolean
        required: true
        default: false

permissions: {}

# One release at a time, and a run that has begun is never cancelled: an upload cut short would
# leave its build number half used.
concurrency:
  group: ios-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_ENVIRONMENT: ${{ inputs.environment }}
  RELEASE_UPLOAD: ${{ inputs.upload }}

jobs:
  build:
    name: build
    # GitHub's Xcode 27 image on its standard arm64 runner, never xcode-27-xlarge, a larger
    # runner billed apart (tools/ci/toolchain.py; .github/actionlint.yaml).
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I tools/ci/ios_release_steps.py plan
        timeout-minutes: 2
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      - run: python3 -I tools/ci/ios_release_steps.py toolchain
        timeout-minutes: 5
      - run: python3 -I tools/ci/ios_release_steps.py xcodegen
        timeout-minutes: 5
      - run: python3 -I tools/ci/ios_release_steps.py archive
        timeout-minutes: 30
      - run: python3 -I tools/ci/ios_release_steps.py check
        timeout-minutes: 5
      - run: python3 -I tools/ci/ios_release_steps.py pack
        timeout-minutes: 5
      # The archive alone, signed ad hoc, for the sign job: no log, and nothing that holds a secret.
      - if: ${{ inputs.upload && inputs.environment == 'dev' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: archive-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-release-out/Tadayo.xcarchive.tar
          if-no-files-found: error
          retention-days: 1

  # A fresh runner that runs no file of the build's: only this checkout's ios_release_steps.py
  # and Xcode. The tar is data from a job that ran other people's code, and unpack treats it so:
  # it is downloaded into a folder of its own, which no other step reads. The artifact is named
  # for the attempt, so a re-run of this job alone finds none and fails: re-run all jobs.
  sign:
    name: sign
    needs: build
    if: ${{ inputs.upload && inputs.environment == 'dev' }}
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: archive-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-release-in
      - run: python3 -I tools/ci/ios_release_steps.py toolchain
        timeout-minutes: 5
      - run: python3 -I tools/ci/ios_release_steps.py unpack
        timeout-minutes: 5
      - run: python3 -I tools/ci/ios_release_steps.py check
        timeout-minutes: 5
      - run: python3 -I tools/ci/ios_release_steps.py export
        timeout-minutes: 15
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      - run: python3 -I tools/ci/ios_release_steps.py upload
        timeout-minutes: 15
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
