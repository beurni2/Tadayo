# ci: the required check (docs/TECH-DESIGN.md section 9; the B0 plan's slice 2).
# Thin on purpose: every step calls tools/ci/ci_steps.py, where the logic and its tests live.
# CI configuration: change this file only in its own PR (docs/INVARIANTS.md T58).
name: ci

on:
  push:
    branches-ignore:
      - evidence

permissions: {}

# A branch keeps only its newest run. Each commit on main gets its own group, so a merge's run
# is never dropped while it waits behind another.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  node:
    name: node
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: python3 tools/ci/ci_steps.py setup-pnpm
      - run: python3 tools/ci/ci_steps.py install
      - run: python3 tools/ci/ci_steps.py lint
      - run: python3 tools/ci/ci_steps.py typecheck
      - run: python3 tools/ci/ci_steps.py format
      - run: python3 tools/ci/ci_steps.py copy-lint
      - run: python3 tools/ci/ci_steps.py openapi
      - run: python3 tools/ci/ci_steps.py unit
      - run: python3 tools/ci/ci_steps.py web
      - run: python3 tools/ci/ci_steps.py audit

  postgres:
    name: postgres
    runs-on: ubuntu-24.04
    # The privacy step takes 13 to 14 minutes and was cut off at 20 on slower runners
    # (docs/LIMITATIONS.md, 2026-11-26). deploy-dev looks for ci's result on main for
    # 39 min 40 s (tools/ci/deploy_dev_steps.py, CI_POLLS); this limit and the ci job's
    # fit in that, which tools/ci/deploy_dev_steps_test.py checks.
    timeout-minutes: 34
    permissions:
      contents: read
    services:
      postgres:
        # Supabase's major version for new projects (tools/ci/toolchain.py); db-check fails if they differ.
        image: postgres:17.11@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        # Made like Supabase's (ADR-026): its superuser is supabase_admin, and db-bootstrap makes
        # `postgres`. The password is CI's own throwaway server's, not a secret (tools/ci/ci_steps.py).
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: python3 tools/ci/ci_steps.py setup-pnpm
      - run: python3 tools/ci/ci_steps.py install
      - run: python3 tools/ci/ci_steps.py db-check
      - run: python3 tools/ci/ci_steps.py db-bootstrap
      - run: python3 tools/ci/ci_steps.py db-tests
      - run: python3 tools/ci/ci_steps.py privacy

  swift:
    name: swift
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/ci/ci_steps.py swift

  tools:
    name: tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/ci/ci_steps.py tools-tests

  guards:
    name: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the guards compare the branch with origin/main
          persist-credentials: false
      - run: python3 tools/ci/ci_steps.py guards

  ci:
    name: ci
    if: always()
    needs: [node, postgres, swift, tools, guards]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      - name: every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/ci_steps.py verdict
