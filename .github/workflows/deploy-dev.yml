# deploy-dev: on every merge to main, once that commit's ci run has passed, migrates dev, deploys
# main to Fly, runs storage-setup and the Supabase probe on a Fly machine, asks the API for a
# neutral 401, and publishes apps/web to Cloudflare Pages (docs/TECH-DESIGN.md section 9; the B0
# plan's slice 10c and its workflow table).
# Thin on purpose: every step calls tools/ci/deploy_dev_steps.py, ops_steps.py or ci_steps.py,
# where the logic and its tests live (deploy_dev_steps_test.py reads this file). The ops steps
# are ops.yml's own, so a deploy passes the same checks as a run by hand.
# CI configuration: change this file only in its own PR (docs/INVARIANTS.md T58).
name: deploy-dev

on:
  push:
    branches:
      - main

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Waits for this commit's ci run, holding no secret but the job's read-only token, and a group of
  # its own commit's only, so a deploy that waits keeps nothing else off dev.
  ci:
    name: wait for ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read  # the commit's ci runs
    concurrency:
      group: deploy-dev-ci-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: wait-ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci/deploy_dev_steps.py wait-ci

  deploy:
    name: deploy
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read  # the commit's ci runs, read again by deploy-branch
    # ops.yml's group: one job acts on dev at a time, and one that has begun is never cancelled.
    # GitHub keeps one pending job or run per group and a newer one cancels it, so `queue: max`
    # goes here and in ops.yml once actionlint accepts the key (docs/LIMITATIONS.md); until then,
    # an ops run is started only when no deploy-dev job is running or waiting, and a deploy job
    # that ended cancelled is run again once the group is free.
    concurrency:
      group: ops-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: python3 tools/ci/ci_steps.py setup-pnpm
      - run: python3 tools/ci/ci_steps.py install
      - name: setup-flyctl
        env:
          OPS_SCRIPT: deploy-branch
        run: python3 tools/ci/ops_steps.py setup-flyctl
      - name: migrate
        env:
          OPS_SCRIPT: migrate
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
        run: python3 tools/ci/ops_steps.py run
      - name: deploy-branch
        env:
          OPS_SCRIPT: deploy-branch
          OPS_BRANCH: main
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci/ops_steps.py run
      - name: storage-setup
        env:
          OPS_SCRIPT: storage-setup
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
        run: python3 tools/ci/ops_steps.py run
      - name: supabase-probe
        env:
          OPS_SCRIPT: supabase-probe
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 tools/ci/ops_steps.py run
      - run: python3 tools/ci/deploy_dev_steps.py check-api
      - run: python3 tools/ci/ci_steps.py web
      - run: python3 tools/ci/deploy_dev_steps.py setup-wrangler
      - name: pages-project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/ci/deploy_dev_steps.py pages-project
      - name: pages-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/ci/deploy_dev_steps.py pages-deploy
      - name: check-association
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/ci/deploy_dev_steps.py check-association
